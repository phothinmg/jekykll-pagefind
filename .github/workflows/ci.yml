name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop lib/jekyll-pagefind.rb

      - name: Smoke test
        run: make smoke-test

      - name: Build host gem
        run: make build
